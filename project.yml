name: BlinkenLights
options:
  bundleIdPrefix: io.github.s-walabee
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BlinkenLights:
    type: application
    platform: macOS
    sources: [BlinkenLights]
    info:
      path: BlinkenLights/Info.plist
      properties:
        CFBundleDisplayName: BlinkenLights
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.s-walabee.BlinkenLights
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 239D4N8F2F
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
